name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Version sources agree
        run: python3 tools/verify_release_version.py
      - name: Fetch the JVM test dependency
        run: python3 tools/fetch_test_deps.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
